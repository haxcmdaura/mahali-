name: Build Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_msvc2019_64
          modules: 'qthttpserver qtwebsockets'
          setup-python: 'false'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target mahali-desktop
      - name: Build tests
        run: cmake --build build --config Release
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy
        shell: pwsh
        run: |
          mkdir dist
          $exe = Get-ChildItem -Recurse -Filter "mahali-desktop.exe" build | Select-Object -First 1
          Copy-Item $exe.FullName dist\
          windeployqt --release --compiler-runtime "dist\mahali-desktop.exe"
          copy apps\desktop\mahali-green.ico dist\
          copy packaging\Installer.bat dist\
          copy packaging\CreateShortcut.ps1 dist\
      - name: Verify deployed Qt runtime
        shell: pwsh
        run: |
          $required = @(
            "dist\Qt6Sql.dll",
            "dist\Qt6PrintSupport.dll",
            "dist\Qt6Network.dll",
            "dist\platforms\qwindows.dll",
            "dist\sqldrivers\qsqlite.dll"
          )
          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              $missing += $path
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing deployed Qt files: $($missing -join ', ')"
          }
      - name: Zip
        run: Compress-Archive -Path dist\* -DestinationPath "Mahali-${{ github.ref_name }}-win64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mahali-msvc
          path: "Mahali-${{ github.ref_name }}-win64.zip"

  release:
    needs: build-msvc
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mahali-msvc
      - uses: softprops/action-gh-release@v2
        with:
          files: "Mahali-${{ github.ref_name }}-win64.zip"
          generate_release_notes: true
